name: Materialize SahaNova source

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    paths:
      - ".github/workflows/materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name != 'issues' || github.event.issue.title == 'Materialize SahaNova source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout seed repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          source = Path('.seed/part-06').read_bytes()
          expected = 'aada3c802d68814f96f42886adc16c3c8292a89ac832c0ad842dbd55e8cb54e4'
          if len(source) != 12001:
              raise SystemExit(f'unexpected part-06 size: {len(source)}')
          repaired = None
          removed_at = None
          for i in range(len(source)):
              candidate = source[:i] + source[i + 1:]
              if hashlib.sha256(candidate).hexdigest() == expected:
                  repaired = candidate
                  removed_at = i
                  break
          if repaired is None:
              raise SystemExit('could not repair part-06 to expected SHA-256')
          Path('/tmp/part-06-fixed').write_bytes(repaired)
          print(f'repaired part-06 by removing transfer artifact at byte {removed_at}')
          PY
          cat .seed/part-00 .seed/part-01 .seed/part-02 .seed/part-03 .seed/part-04 .seed/part-05 /tmp/part-06-fixed .seed/part-07 .seed/part-08 | base64 -d > /tmp/sahanova.bundle
          echo "65c14d95a323290e3fc3c646721ec3f5af7102133b132048f81d86757b471058  /tmp/sahanova.bundle" | sha256sum -c -
          rm -rf /tmp/sahanova-src
          mkdir -p /tmp/sahanova-src
          git -C /tmp/sahanova-src init
          git -C /tmp/sahanova-src fetch /tmp/sahanova.bundle refs/heads/main:refs/heads/main
          git -C /tmp/sahanova-src checkout main

      - name: Materialize exact project tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/materialize.yml /tmp/materialize.yml
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          (cd /tmp/sahanova-src && tar --exclude=.git -cf - .) | (cd "$GITHUB_WORKSPACE" && tar -xf -)
          mkdir -p .github/workflows
          cp /tmp/materialize.yml .github/workflows/materialize.yml

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import complete SahaNova Cloudflare project"
            git push origin HEAD:main
          fi
